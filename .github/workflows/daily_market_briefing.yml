name: Daily Market Briefing

on:
  schedule:
    - cron: "0 1 * * *" # 10:00 KST
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader jinja2 pyyaml


      - name: Generate daily briefing
        run: |
          python src/main.py

      - name: Commit generated HTML in output/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.html || true

          if git diff --cached --quiet; then
            echo "No HTML changes to commit in output/"
          else
            git commit -m "chore: output HTML 갱신 $(date -u +%F)"
            git push
          fi
