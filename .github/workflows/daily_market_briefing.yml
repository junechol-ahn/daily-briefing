name: Daily Market Briefing

on:
  schedule:
    - cron: "0 1 * * *" # 10:00 KST
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install finance-datareader jinja2 pyyaml

      - name: Generate daily briefing
        run: |
          python -m src.main

      - name: Commit output (optional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ data/raw/ || true
          git commit -m "chore: 일일 시장 요약 갱신 $(date -u +%F)" || echo "No changes to commit"
          git push
